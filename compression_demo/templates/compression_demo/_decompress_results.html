<div class="space-y-4">
  <div>
    <label class="block font-semibold mb-1">Decompressed output</label>
    <textarea
      id="decompressed-text-output"
      readonly
      class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 resize-y"
      rows="6"
    >{{ decompressed_text|default:"Decompressed text will appear here." }}</textarea>
  </div>

  {% if error %}
    <p class="text-sm">{{ error }}</p>
  {% endif %}
</div>
