<li
  class="bg-amber-50/60 rounded-2xl p-6 sm:p-8 shadow-md grid grid-cols-1 md:grid-cols-2 gap-10 lg:gap-16 items-center"
>
  {% if project.image %}
  <div
    class="w-full rounded-xl shadow-[0px_0px_20px_4px] shadow-amber-600/20 overflow-hidden"
  >
    <img
      class="w-full h-56 sm:h-64 object-cover"
      src="{{ project.image.url }}"
      alt="{{ project.title }}"
      loading="lazy"
    />
  </div>
  {% endif %}

  <div class="flex flex-col items-start gap-6">
    <h3 class="text-xl font-bold">{{ project.title }}</h3>
    <p class="text-base sm:text-lg text-sky-800">{{ project.list_summary }}</p>
    <a
      class="w-fit bg-navy-blue text-white text-sm font-bold py-4 rounded-lg px-10 hover:-translate-y-0.5 duration-300"
      href="{% url 'home/project_detail' slug=project.slug %}"
    >
      PROJECT INFO
    </a>
  </div>
</li>
